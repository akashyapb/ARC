<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal</title>
    <link rel="stylesheet" href="../src/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Employee Portal</h1>
            <div id="userInfo"></div>
            <button onclick="logout()" class="btn btn-secondary">Logout</button>
        </header>

        <main>
            <section class="attendance-section">
                <h2>Attendance</h2>
                <div class="punch-buttons">
                    <button id="punchInBtn" class="btn btn-primary">Punch In</button>
                    <button id="punchOutBtn" class="btn btn-primary">Punch Out</button>
                </div>
                <div id="punchStatus"></div>
            </section>

            <section class="leave-section">
                <h2>Leave Request</h2>
                <form id="leaveRequestForm">
                    <div class="form-group">
                        <label for="startDate">Start Date</label>
                        <input type="date" id="startDate" required class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="endDate">End Date</label>
                        <input type="date" id="endDate" required class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="reason">Reason</label>
                        <textarea id="reason" required class="form-control"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit Request</button>
                </form>
            </section>

            <section class="history-section">
                <h2>Attendance History</h2>
                <table class="table" id="attendanceTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Punch In</th>
                            <th>Punch Out</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="../src/js/portal.js"></script>
</body>
</html>
